version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: timegrid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zeek_logs
      MYSQL_USER: zeek_user
      MYSQL_PASSWORD: zeek_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - timegrid

  backend:
    build:
      context: ./backend
    container_name: timegrid-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      TG_DB_HOST: mysql
      TG_DB_USER: zeek_user
      TG_DB_PASSWORD: zeek_password
      TG_DB_NAME: zeek_logs
      TG_JWT_SECRET: dev-secret-change-me
      TG_DEV_MODE: "true"
    ports:
      - "8000:8000"
    networks:
      - timegrid

  grafana:
    image: grafana/grafana:latest
    container_name: timegrid-grafana
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "4500:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - timegrid

volumes:
  mysql-data:
  grafana-data:

networks:
  timegrid:
    driver: bridge
